<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>White Lion Boss - Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#07070d;overflow:hidden;font-family:system-ui,"Segoe UI",Arial,sans-serif;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:800px;height:450px;transform-origin:0 0;background:#000;overflow:hidden}
#game{position:absolute;left:0;top:0;width:800px;height:450px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,25,.78);color:#fff;text-align:center}
.screen.show{display:flex}
h1{margin:0 0 4px;font-size:54px;letter-spacing:3px;color:#ffd24a;text-shadow:0 4px 0 #8a5a00,0 8px 18px rgba(0,0,0,.6)}
h2{margin:0 0 10px;font-size:40px;color:#ffd24a}
.sub{opacity:.85;margin:4px 0 14px;font-size:16px}
.btn{background:linear-gradient(#ffd24a,#e59a12);color:#3a2500;border:0;border-radius:14px;padding:12px 26px;font-size:20px;font-weight:800;margin:6px;cursor:pointer;box-shadow:0 5px 0 #8a5a00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5a00}
.btn.alt{background:linear-gradient(#7fd0ff,#2f8fe0);color:#06243f;box-shadow:0 5px 0 #124d82}
.btn.ad{background:linear-gradient(#8cf08c,#2fb84a);color:#052b0f;box-shadow:0 5px 0 #14702a}
.btn.small{font-size:15px;padding:8px 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.stat{font-size:22px;margin:3px 0}
#custom{flex-direction:row;justify-content:flex-start;padding:16px;gap:16px;align-items:stretch;text-align:left}
#pvWrap{width:240px;display:flex;flex-direction:column;align-items:center}
#pv{width:240px;height:320px;border-radius:16px;background:#1b1536;border:2px solid #ffd24a}
#cpanel{flex:1;display:flex;flex-direction:column;min-width:0}
#coinsEl{font-size:26px;font-weight:800;color:#ffd24a;margin-bottom:6px}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:#2a2350;color:#fff;border:2px solid #4a3f8a;border-radius:10px;padding:7px 11px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:#ffd24a;color:#3a2500;border-color:#ffd24a}
#opts{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1;overflow:auto}
.opt{width:112px;background:#241d49;border:3px solid #3d3478;border-radius:12px;padding:8px;text-align:center;cursor:pointer;font-size:14px;font-weight:700}
.opt.sel{border-color:#ffd24a;background:#3a2f78}
.opt .sw{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;border:2px solid #fff}
.opt .pr{font-size:13px;color:#ffd24a;margin-top:2px}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:10px;font-weight:700;display:none;color:#fff;z-index:9}
#adbox{font-size:26px;font-weight:800}
#bPause{position:absolute;right:12px;top:46px;display:none;padding:3px 12px;font-size:18px;margin:0;z-index:5}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button class="btn alt small" id="bPause">&#10074;&#10074;</button>

  <div id="menu" class="screen show">
    <h1>WHITE LION BOSS</h1>
    <div class="sub">Run. Jump. Collect coins. Style your lion.</div>
    <div class="stat" id="menuStats"></div>
    <div class="row">
      <button class="btn" id="bPlay">PLAY</button>
      <button class="btn alt" id="bCustom">CUSTOMIZE</button>
    </div>
    <div class="row">
      <button class="btn ad small" id="bDaily">&#127873; DAILY BONUS</button>
      <button class="btn alt small" id="bMute">&#128266;</button>
    </div>
    <div class="sub" style="font-size:14px;margin-top:6px">Tap / Click / Space to jump &bull; tap again in the air to double jump<br>(Phone: rotate to landscape)</div>
  </div>

  <div id="custom" class="screen">
    <div id="pvWrap">
      <canvas id="pv" width="240" height="320"></canvas>
      <button class="btn small" id="bBack" style="margin-top:10px">&larr; BACK</button>
    </div>
    <div id="cpanel">
      <div id="coinsEl"></div>
      <div id="tabs"></div>
      <div id="opts"></div>
      <div><button class="btn ad small" id="bAdCoins">&#127916; Watch Ad: +50 coins</button></div>
    </div>
  </div>

  <div id="over" class="screen">
    <h2 id="ovTitle">GAME OVER</h2>
    <div class="stat" id="ovScore"></div>
    <div class="stat" id="ovCoins"></div>
    <div class="row">
      <button class="btn" id="bAgain">PLAY AGAIN</button>
      <button class="btn ad" id="bRevive">&#127916; Revive (Ad)</button>
    </div>
    <div class="row">
      <button class="btn ad small" id="bDouble">&#127916; Double coins (Ad)</button>
      <button class="btn alt small" id="bCustom2">CUSTOMIZE</button>
      <button class="btn alt small" id="bMenu">MENU</button>
    </div>
  </div>

  <div id="pause" class="screen">
    <h2>PAUSED</h2>
    <div class="row">
      <button class="btn" id="bResume">RESUME</button>
      <button class="btn alt" id="bMenu2">MENU</button>
    </div>
  </div>

  <div id="daily" class="screen">
    <h2>&#127873; DAILY BONUS</h2>
    <div class="stat" id="dailyTxt"></div>
    <div class="row">
      <button class="btn" id="bClaim">CLAIM</button>
      <button class="btn ad" id="bClaim2">&#127916; Claim 2x (Ad)</button>
    </div>
    <button class="btn alt small" id="bDailyBack">&larr; BACK</button>
  </div>

  <div id="ad" class="screen" style="background:rgba(0,0,0,.92)">
    <div id="adbox">Loading ad...</div>
    <div class="sub" id="adNote" style="max-width:520px;margin-top:14px">
      Browser test mode: this is a fake ad. In the Android app a real Google AdMob ad is shown here.
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ============================================================
   WHITE LION BOSS - 2D RUNNER (single file, no external assets)
   v1.1  -  power-ups, birds, day/night, daily bonus, pause, AdMob-ready
   ============================================================ */

/* ---------- AD CONFIG (EDIT THIS BEFORE PUBLISHING) ----------
   TEST_MODE true  = Google's official TEST ads (safe while developing).
   TEST_MODE false = your REAL ads. Put your real ad unit IDs in "real".
   NEVER click your own real ads - Google can ban the account.
   The AdMob *App ID* is NOT written here, it goes in AndroidManifest.xml. */
const ADCFG = {
  TEST_MODE: true,
  rewarded:     { test: 'ca-app-pub-3940256099942544/5224354917', real: 'ca-app-pub-XXXXXXXXXXXXXXXX/YYYYYYYYYY' },
  interstitial: { test: 'ca-app-pub-3940256099942544/1033173712', real: 'ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ' },
  INTERSTITIAL_EVERY: 3   // show a full-screen ad after every 3rd run
};
const adId = k => ADCFG.TEST_MODE ? ADCFG[k].test : ADCFG[k].real;

const W = 800, H = 450, GROUND = 372, R = 2;
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
cv.width = W * R; cv.height = H * R;
const stage = $('stage');
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = 'translate(' + ((innerWidth - W * s) / 2) + 'px,' + ((innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
}
addEventListener('resize', fit); fit();

/* ---------- Catalog (price 0 = free) ---------- */
const CAT = {
  fur: [
    {id:'white', name:'Snow White', c:'#f4f0e6', p:0},
    {id:'cream', name:'Cream',      c:'#ecd7a6', p:0},
    {id:'golden',name:'Golden',     c:'#e2a94b', p:100},
    {id:'grey',  name:'Silver Grey',c:'#b9bec8', p:100},
    {id:'brown', name:'Brown',      c:'#9a6a3e', p:120},
    {id:'pink',  name:'Pink',       c:'#f5b5d0', p:150},
    {id:'black', name:'Shadow',     c:'#3b3b44', p:200}
  ],
  suit: [
    {id:'white', name:'White',  c:'#ffffff', p:0},
    {id:'black', name:'Black',  c:'#1d1d24', p:100},
    {id:'red',   name:'Red',    c:'#c9303c', p:100},
    {id:'blue',  name:'Blue',   c:'#2c58c9', p:100},
    {id:'green', name:'Green',  c:'#208c5e', p:100},
    {id:'teal',  name:'Teal',   c:'#1a9aa8', p:120},
    {id:'pinks', name:'Pink',   c:'#e86aa8', p:120},
    {id:'purple',name:'Purple', c:'#7a3bc4', p:150},
    {id:'gold',  name:'Gold',   c:'#d9ad36', p:200}
  ],
  pat: [
    {id:'plain',   name:'Plain',   p:0},
    {id:'stripes', name:'Stripes', p:80},
    {id:'checks',  name:'Checks',  p:120},
    {id:'dots',    name:'Dots',    p:120},
    {id:'diamond', name:'Diamond', p:150}
  ],
  hat: [
    {id:'none',  name:'No hat',  p:0},
    {id:'cap',   name:'Red cap', p:100},
    {id:'top',   name:'Top hat', p:150},
    {id:'crown', name:'Crown',   p:200}
  ],
  cape: [
    {id:'none',  name:'No cape', p:0},
    {id:'red',   name:'Red',    c:'#c9303c', p:120},
    {id:'blue',  name:'Blue',   c:'#2c58c9', p:120},
    {id:'black', name:'Black',  c:'#22222a', p:120},
    {id:'purple',name:'Purple', c:'#7a3bc4', p:150},
    {id:'gold',  name:'Gold',   c:'#e0b030', p:180}
  ]
};
const item = (cat, id) => CAT[cat].find(i => i.id === id) || CAT[cat][0];

/* ---------- Save data ---------- */
const KEY = 'wlb_save_v1';
const DEF_CFG = {fur:'white', suit:'white', pat:'plain', hat:'none', cape:'none', glasses:true, chain:true};
let save = {coins:0, best:0, owned:{}, cfg:Object.assign({}, DEF_CFG), mute:false, tut:false, daily:{last:'', streak:0}};
try {
  const s = JSON.parse(localStorage.getItem(KEY) || '{}');
  save = Object.assign(save, s);
  save.cfg = Object.assign({}, DEF_CFG, save.cfg || {});
  save.daily = Object.assign({last:'', streak:0}, save.daily || {});
} catch(e){}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }
addEventListener('pagehide', persist);

/* ---------- Helpers ---------- */
function shade(hex, a){
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, v));
  return 'rgb(' + cl((n >> 16) + a) + ',' + cl(((n >> 8) & 255) + a) + ',' + cl((n & 255) + a) + ')';
}
function lum(hex){ const n = parseInt(hex.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255); }
function rr(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const rnd = (a, b) => a + Math.random() * (b - a);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let ac;
function beep(f, d, type, v){
  if (save.mute) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = f; g.gain.value = v || 0.03;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.stop(ac.currentTime + d);
  } catch(e){}
}

/* ============================================================
   ADS  (works in browser = fake ads, in Android app = real AdMob)
   ============================================================ */
const Ads = {
  plugin(){
    try {
      const C = window.Capacitor;
      if (!(C && C.isNativePlatform && C.isNativePlatform())) return null;   // normal browser => fake ads
      if (!this._p) this._p = C.registerPlugin ? C.registerPlugin('AdMob') : (C.Plugins && C.Plugins.AdMob);
      return this._p || null;
    } catch(e){ return null; }
  },
  isNative(){ return !!this.plugin(); },
  async init(){
    const A = this.plugin(); if (!A) return;
    try { await A.initialize({initializeForTesting: ADCFG.TEST_MODE}); } catch(e){}
  },
  /* Rewarded video: onReward() only if user watched fully, else onFail() */
  rewarded(onReward, onFail){
    const A = this.plugin();
    if (!A) {                                   // browser test mode
      let s = 3; $('adbox').textContent = 'Ad playing... ' + s;
      const iv = setInterval(() => { s--; $('adbox').textContent = 'Ad playing... ' + s; if (s <= 0) { clearInterval(iv); onReward(); } }, 1000);
      return;
    }
    let earned = false, finished = false; const handles = [];
    const finish = ok => {
      if (finished) return; finished = true;
      handles.forEach(h => { try { h.remove(); } catch(e){} });
      ok ? onReward() : onFail();
    };
    (async () => {
      try {
        handles.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
        handles.push(await A.addListener('onRewardedVideoAdDismissed', () => finish(earned)));
        handles.push(await A.addListener('onRewardedVideoAdFailedToLoad', () => finish(false)));
        handles.push(await A.addListener('onRewardedVideoAdFailedToShow', () => finish(false)));
        await A.prepareRewardVideoAd({adId: adId('rewarded')});
        const r = await A.showRewardVideoAd(); if (r) earned = true;
      } catch(e){ finish(false); }
    })();
  },
  /* Full-screen ad between runs. done() is always called (even if ad fails). */
  interstitial(done){
    const A = this.plugin();
    if (!A) { showScreen('ad'); $('adbox').textContent = 'Interstitial ad (test)'; setTimeout(done, 1500); return; }
    let finished = false; const handles = [];
    const fin = () => { if (finished) return; finished = true; handles.forEach(h => { try { h.remove(); } catch(e){} }); done(); };
    (async () => {
      try {
        handles.push(await A.addListener('interstitialAdDismissed', fin));
        handles.push(await A.addListener('interstitialAdFailedToLoad', fin));
        handles.push(await A.addListener('interstitialAdFailedToShow', fin));
        await A.prepareInterstitial({adId: adId('interstitial')});
        await A.showInterstitial();
      } catch(e){ fin(); }
    })();
  }
};
function showRewardedAd(onReward, back){
  showScreen('ad');
  $('adNote').style.display = Ads.isNative() ? 'none' : 'block';
  $('adbox').textContent = Ads.isNative() ? 'Loading ad...' : 'Ad playing... 3';
  Ads.rewarded(onReward, () => { showScreen(back || null); toast('Ad not available, try again'); });
}
let runCount = 0;
function afterRun(startFn){
  runCount++;
  if (runCount % ADCFG.INTERSTITIAL_EVERY === 0) {
    $('adNote').style.display = 'none';
    Ads.interstitial(startFn);
  } else startFn();
}

/* ---------- Lion drawing ---------- */
function leg(c, hx, ang, col, paw){
  c.save(); c.translate(hx, -26); c.rotate(ang);
  c.fillStyle = col; rr(c, -5, 0, 10, 18, 3); c.fill();
  c.fillStyle = paw; rr(c, -6, 16, 14, 8, 4); c.fill();
  c.restore();
}
function pattern(c, type, suit){
  if (type === 'plain') return;
  const d = lum(suit) < 120 ? shade(suit, 70) : shade(suit, -55);
  c.fillStyle = d; c.strokeStyle = d; c.globalAlpha = c.globalAlpha * 0.6;
  if (type === 'stripes') { for (let x = -17; x < 17; x += 7) c.fillRect(x, -66, 3, 42); }
  else if (type === 'checks') { for (let i = 0; i < 5; i++) for (let j = 0; j < 6; j++) if ((i + j) % 2) c.fillRect(-17 + i * 8, -66 + j * 8, 8, 8); }
  else if (type === 'dots') { for (let x = -12; x < 17; x += 9) for (let y = -60; y < -24; y += 9) { c.beginPath(); c.arc(x, y, 2.2, 0, 6.3); c.fill(); } }
  else if (type === 'diamond') {
    c.lineWidth = 1.6;
    for (let k = -40; k < 50; k += 12) {
      c.beginPath(); c.moveTo(-17, -66 + k); c.lineTo(17, -66 + k + 34); c.stroke();
      c.beginPath(); c.moveTo(-17, -66 + k + 34); c.lineTo(17, -66 + k); c.stroke();
    }
  }
}
function drawLion(c, x, y, t, cfg, sc, air, alpha){
  const fur = item('fur', cfg.fur).c, suit = item('suit', cfg.suit).c;
  const mane = shade(fur, -30), furD = shade(fur, -20), furL = shade(fur, 12), suitD = shade(suit, -30);
  c.save(); c.translate(x, y); c.scale(sc, sc); if (alpha != null) c.globalAlpha = alpha;
  const sw = air ? 0 : Math.sin(t * 0.4), la = air ? 0.7 : sw * 0.75;
  // cape (behind body)
  if (cfg.cape && cfg.cape !== 'none') {
    const cc = item('cape', cfg.cape).c, w = Math.sin(t * 0.3) * 5 + (air ? -6 : 0);
    c.fillStyle = cc; c.beginPath(); c.moveTo(-12, -64);
    c.quadraticCurveTo(-34, -60 + w, -54, -38 + w * 1.6); c.lineTo(-48, -24 + w);
    c.quadraticCurveTo(-26, -40, -10, -28); c.closePath(); c.fill();
    c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.moveTo(-14, -62);
    c.quadraticCurveTo(-34, -52 + w, -50, -34 + w * 1.5); c.lineTo(-46, -30 + w); c.quadraticCurveTo(-26, -42, -12, -36); c.closePath(); c.fill();
  }
  // tail
  c.strokeStyle = fur; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-15, -34); c.quadraticCurveTo(-40, -34 + Math.sin(t * 0.3) * 8, -36, -62); c.stroke();
  c.fillStyle = mane; c.beginPath(); c.arc(-36, -64, 6, 0, 6.3); c.fill();
  // back leg
  leg(c, -5, -la, suitD, furD);
  // body
  rr(c, -17, -66, 34, 42, 9); c.fillStyle = suit; c.fill();
  c.save(); rr(c, -17, -66, 34, 42, 9); c.clip(); pattern(c, cfg.pat, suit); c.restore();
  // shirt + lapel
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -66); c.lineTo(10, -66); c.lineTo(4, -46); c.closePath(); c.fill();
  c.fillStyle = suitD; c.beginPath(); c.moveTo(-3, -66); c.lineTo(3, -54); c.lineTo(-2, -47); c.closePath(); c.fill();
  c.fillStyle = '#e8c04a'; c.beginPath(); c.arc(8, -38, 1.8, 0, 6.3); c.arc(8, -30, 1.8, 0, 6.3); c.fill();
  // front leg
  leg(c, 6, la, suit, fur);
  // front arm
  c.save(); c.translate(2, -60); c.rotate(air ? -1.0 : -sw * 0.8);
  c.fillStyle = suit; rr(c, -4.5, 0, 9, 20, 4); c.fill();
  c.fillStyle = fur; c.beginPath(); c.arc(0, 22, 5.5, 0, 6.3); c.fill(); c.restore();
  // mane
  c.fillStyle = mane;
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; c.beginPath(); c.arc(7 + Math.cos(a) * 18, -80 + Math.sin(a) * 18, 9, 0, 6.3); c.fill(); }
  c.beginPath(); c.arc(7, -80, 19, 0, 6.3); c.fill();
  // ears
  c.fillStyle = fur; c.beginPath(); c.arc(0, -96, 5.5, 0, 6.3); c.arc(18, -96, 5.5, 0, 6.3); c.fill();
  c.fillStyle = '#e9a0b0'; c.beginPath(); c.arc(0, -96, 2.6, 0, 6.3); c.arc(18, -96, 2.6, 0, 6.3); c.fill();
  // head
  c.fillStyle = fur; c.beginPath(); c.arc(9, -78, 15, 0, 6.3); c.fill();
  c.fillStyle = furL; c.beginPath(); c.ellipse(19, -73, 8.5, 6.5, 0, 0, 6.3); c.fill();
  c.fillStyle = '#b8586c'; c.beginPath(); c.moveTo(23, -78); c.lineTo(29, -77); c.lineTo(25, -73); c.closePath(); c.fill();
  c.strokeStyle = '#6b3b3b'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(24, -72); c.quadraticCurveTo(21, -67, 15, -68); c.stroke();
  if (cfg.glasses) {
    c.fillStyle = '#111'; rr(c, 8, -88, 18, 9, 3); c.fill();
    c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(11, -86, 6, 2);
    c.strokeStyle = '#111'; c.lineWidth = 2; c.beginPath(); c.moveTo(8, -84); c.lineTo(-3, -86); c.stroke();
  } else {
    c.fillStyle = '#222'; c.beginPath(); c.arc(16, -83, 2.4, 0, 6.3); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(16.8, -83.8, 0.8, 0, 6.3); c.fill();
  }
  // hats
  if (cfg.hat === 'crown') {
    c.fillStyle = '#f2c230'; c.beginPath();
    c.moveTo(-1, -97); c.lineTo(-2, -112); c.lineTo(5, -104); c.lineTo(9, -114); c.lineTo(14, -104); c.lineTo(21, -112); c.lineTo(20, -97); c.closePath(); c.fill();
    c.fillStyle = '#d6293b'; c.beginPath(); c.arc(9, -100, 2.2, 0, 6.3); c.fill();
    c.fillStyle = '#2d7be0'; c.beginPath(); c.arc(2, -100, 1.6, 0, 6.3); c.arc(16, -100, 1.6, 0, 6.3); c.fill();
  } else if (cfg.hat === 'cap') {
    c.fillStyle = '#d6293b'; c.beginPath(); c.arc(9, -94, 15, Math.PI, 0); c.closePath(); c.fill();
    c.fillStyle = '#a81c2b'; rr(c, 9, -96, 24, 4, 2); c.fill();
  } else if (cfg.hat === 'top') {
    c.fillStyle = '#16161c'; rr(c, -1, -124, 20, 28, 2); c.fill(); rr(c, -7, -99, 32, 6, 3); c.fill();
    c.fillStyle = '#d6293b'; c.fillRect(-1, -104, 20, 5);
  }
  // gold chain
  if (cfg.chain) {
    c.strokeStyle = '#f5c518'; c.lineWidth = 2.6; c.beginPath(); c.moveTo(-8, -58); c.quadraticCurveTo(3, -36, 13, -58); c.stroke();
    c.fillStyle = '#f5c518'; c.beginPath(); c.arc(3, -44, 3.6, 0, 6.3); c.fill();
  }
  c.restore();
}

/* ---------- Background (sunset -> night -> day cycle) ---------- */
const PAL = [
  {sky:['#2b1b4d','#c4476a','#ffb673'], far:'#3a2457', near:'#26163d', win:'#ffd36b', sun:'#fff3c4', sunY:250},
  {sky:['#070718','#1b2a63','#4b4f9a'], far:'#17173d', near:'#0c0c27', win:'#ffe28a', sun:'#e8ecff', sunY:150},
  {sky:['#2f6fd0','#7fc4f0','#ffe9b8'], far:'#4f6f9f', near:'#2f4770', win:'#ffe9a0', sun:'#fff8c0', sunY:210}
];
const hex2 = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const lerpA = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = a => 'rgb(' + a.map(Math.round).join(',') + ')';
const cur = {sky: PAL[0].sky.map(hex2), far: hex2(PAL[0].far), near: hex2(PAL[0].near), win: hex2(PAL[0].win), sun: hex2(PAL[0].sun), sunY: 250};
let stageIdx = 0;
function updatePal(k){
  const T = PAL[stageIdx], t = Math.min(1, 0.015 * k);
  cur.sky = cur.sky.map((c, i) => lerpA(c, hex2(T.sky[i]), t));
  cur.far = lerpA(cur.far, hex2(T.far), t); cur.near = lerpA(cur.near, hex2(T.near), t);
  cur.win = lerpA(cur.win, hex2(T.win), t); cur.sun = lerpA(cur.sun, hex2(T.sun), t);
  cur.sunY += (T.sunY - cur.sunY) * t;
}
function makeLayer(n, wMin, wMax, hMin, hMax){
  const items = []; let x = 0;
  for (let i = 0; i < n; i++) {
    const w = rnd(wMin, wMax), h = rnd(hMin, hMax), win = [];
    for (let k = 0; k < 40; k++) win.push(Math.random() < 0.45);
    items.push({x, w, h, win}); x += w + rnd(2, 14);
  }
  return {items, total: x};
}
const layerFar = makeLayer(30, 40, 80, 80, 190), layerNear = makeLayer(22, 60, 110, 50, 130);
const clouds = []; for (let i = 0; i < 6; i++) clouds.push({x: rnd(0, W), y: rnd(30, 140), s: rnd(0.6, 1.3)});
const stars = []; for (let i = 0; i < 45; i++) stars.push({x: rnd(0, W), y: rnd(5, 230), r: rnd(0.6, 1.8)});
function drawLayer(c, L, scroll, f, col, winCol, base){
  const off = (scroll * f) % L.total;
  for (let rep = 0; rep < 2; rep++) {
    for (const b of L.items) {
      const x = b.x - off + rep * L.total;
      if (x > W || x + b.w < 0) continue;
      c.fillStyle = col; c.fillRect(x, base - b.h, b.w, b.h);
      if (winCol) {
        c.fillStyle = winCol; let k = 0;
        for (let wy = base - b.h + 10; wy < base - 12; wy += 16) for (let wx = x + 8; wx < x + b.w - 10; wx += 14) { if (b.win[k++ % 40]) c.fillRect(wx, wy, 6, 8); }
      }
    }
  }
}
function drawBG(c, scroll){
  const g = c.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, rgb(cur.sky[0])); g.addColorStop(0.55, rgb(cur.sky[1])); g.addColorStop(1, rgb(cur.sky[2]));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const dark = Math.max(0, Math.min(1, 1 - (cur.sky[0][0] + cur.sky[0][1] + cur.sky[0][2]) / 150));
  if (dark > 0.05) { c.fillStyle = '#fff'; c.globalAlpha = dark; for (const s of stars) c.fillRect(s.x, s.y, s.r, s.r); c.globalAlpha = 1; }
  c.fillStyle = rgb(cur.sun); c.beginPath(); c.arc(610, cur.sunY, 56, 0, 6.3); c.fill();
  c.fillStyle = 'rgba(255,255,255,.22)';
  for (const cl of clouds) {
    const x = ((cl.x - scroll * 0.08) % (W + 200) + W + 200) % (W + 200) - 100;
    c.beginPath(); c.ellipse(x, cl.y, 50 * cl.s, 14 * cl.s, 0, 0, 6.3); c.ellipse(x + 28 * cl.s, cl.y - 8, 30 * cl.s, 12 * cl.s, 0, 0, 6.3); c.fill();
  }
  drawLayer(c, layerFar, scroll, 0.2, rgb(cur.far), null, GROUND);
  drawLayer(c, layerNear, scroll, 0.45, rgb(cur.near), rgb(cur.win), GROUND);
  c.fillStyle = '#2a2a38'; c.fillRect(0, GROUND, W, H - GROUND);
  c.fillStyle = '#4a4a5c'; c.fillRect(0, GROUND, W, 6);
  c.fillStyle = '#d9d9e8';
  const o = scroll % 80; for (let x = -o; x < W; x += 80) c.fillRect(x, GROUND + 38, 40, 5);
}

/* ---------- Game state ---------- */
let mode = 'menu';  // menu | play | pause | dead | over | custom
let p, obstacles, birds, coins, powers, parts, speed, dist, score, runCoins, gapLeft;
let bgScroll = 0, tAnim = 0, inv = 0, revived = false, doubled = false, shake = 0, shield = false, magnetT = 0;
function reset(){
  p = {x: 150, y: GROUND, vy: 0, jumps: 0};
  obstacles = []; birds = []; coins = []; powers = []; parts = [];
  speed = 5.2; dist = 0; score = 0; runCoins = 0; gapLeft = 380; inv = 0;
  revived = false; doubled = false; shake = 0; shield = false; magnetT = 0;
}
reset();

function spawn(){
  const T = [
    {t:'crate', w:40, h:40}, {t:'barrel', w:34, h:48}, {t:'cone', w:30, h:44},
    {t:'car', w:96, h:46}, {t:'stack', w:40, h:80}, {t:'crate', w:76, h:40}
  ];
  const d = T[Math.floor(Math.random() * T.length)], x = W + 40;
  obstacles.push({x, w: d.w, h: d.h, t: d.t});
  for (let i = 0; i < 5; i++) {                      // coin arc over obstacle
    const k = i - 2;
    coins.push({x: x + d.w / 2 + k * 34, y: GROUND - d.h - 38 - (4 - k * k) * 9});
  }
  const gap = d.w + 270 + speed * 18 + rnd(0, 220);
  if (Math.random() < 0.5) for (let i = 0; i < 4; i++) coins.push({x: x + d.w + gap / 2 + i * 34, y: GROUND - 34});
  if (score > 150 && Math.random() < 0.22) birds.push({x: x + d.w + gap * 0.55, y: GROUND - 128, w: 38, h: 18});
  else if (Math.random() < 0.2) powers.push({x: x + d.w + gap * 0.3, y: GROUND - 62, t: Math.random() < 0.5 ? 'shield' : 'magnet'});
  gapLeft = gap;
}
function jump(){
  if (mode !== 'play') return;
  if (p.jumps < 2) {
    p.vy = p.jumps === 0 ? -12.5 : -11; p.jumps++; beep(p.jumps === 1 ? 420 : 560, 0.1, 'square', 0.025);
    if (!save.tut) { save.tut = true; persist(); }
  }
}
function sparkle(x, y, col){ for (let i = 0; i < 6; i++) parts.push({x, y, vx: rnd(-2, 2), vy: rnd(-3, 1), life: 22, col}); }
function hit(){
  if (shield) { shield = false; inv = 70; sparkle(p.x, p.y - 50, '#7fd0ff'); beep(300, 0.2, 'triangle', 0.04); return; }
  die();
}
function die(){
  mode = 'dead'; shake = 14; beep(120, 0.35, 'sawtooth', 0.05);
  save.coins += runCoins; if (score > save.best) save.best = score; persist();
  setTimeout(showOver, 650);
}
function update(k){
  tAnim += k;
  stageIdx = (mode === 'menu' || mode === 'custom') ? 0 : Math.floor(score / 400) % 3;
  updatePal(k);
  if (mode === 'menu' || mode === 'custom') { bgScroll += 2 * k; return; }
  if (mode === 'dead') {
    for (const q of parts) { q.x += q.vx * k; q.y += q.vy * k; q.life -= k; }
    parts = parts.filter(q => q.life > 0); if (shake > 0) shake -= k; return;
  }
  if (mode !== 'play') return;
  speed = Math.min(11.5, 5.2 + dist / 3000);
  bgScroll += speed * k; dist += speed * k; score = Math.floor(dist / 10);
  if (inv > 0) inv -= k;
  if (magnetT > 0) magnetT -= k;
  p.vy += 0.62 * k; p.y += p.vy * k;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.jumps = 0; }
  gapLeft -= speed * k; if (gapLeft <= 0) spawn();
  for (const o of obstacles) o.x -= speed * k;
  for (const b of birds) b.x -= (speed + 1.5) * k;
  for (const c of coins) c.x -= speed * k;
  for (const u of powers) u.x -= speed * k;
  obstacles = obstacles.filter(o => o.x + o.w > -60);
  birds = birds.filter(b => b.x + b.w > -60);
  powers = powers.filter(u => u.x > -40);
  const cx = p.x + 2, cy = p.y - 40;
  // coins (+ magnet)
  coins = coins.filter(c => {
    if (c.x < -30) return false;
    if (magnetT > 0 && Math.abs(c.x - cx) < 230) { const dx = cx - c.x, dy = cy - c.y, d = Math.hypot(dx, dy) || 1; c.x += dx / d * 8 * k; c.y += dy / d * 8 * k; }
    if (Math.abs(c.x - cx) < 26 && Math.abs(c.y - cy) < 42) { runCoins++; sparkle(c.x, c.y, '#ffd24a'); beep(900, 0.07, 'triangle', 0.03); return false; }
    return true;
  });
  // power-ups
  powers = powers.filter(u => {
    if (Math.abs(u.x - cx) < 30 && Math.abs(u.y - cy) < 46) {
      if (u.t === 'shield') shield = true; else magnetT = 420;
      sparkle(u.x, u.y, u.t === 'shield' ? '#7fd0ff' : '#ff6a7a'); beep(700, 0.18, 'triangle', 0.04); return false;
    }
    return true;
  });
  // collisions
  if (inv <= 0) {
    const x0 = p.x - 12, x1 = p.x + 14, y0 = p.y - 82, y1 = p.y - 4;
    let crashed = false;
    for (const o of obstacles) if (x1 > o.x + 5 && x0 < o.x + o.w - 5 && y1 > GROUND - o.h + 5) { crashed = true; break; }
    if (!crashed) for (const b of birds) if (x1 > b.x + 4 && x0 < b.x + b.w - 4 && y0 < b.y + b.h - 2 && y1 > b.y + 2) { crashed = true; break; }
    if (crashed) hit();
  }
  for (const q of parts) { q.x += q.vx * k; q.y += q.vy * k; q.vy += 0.15 * k; q.life -= k; }
  parts = parts.filter(q => q.life > 0);
}

/* ---------- Render ---------- */
function drawObstacle(c, o){
  const y = GROUND - o.h;
  if (o.t === 'crate' || o.t === 'stack') {
    const rows = o.t === 'stack' ? 2 : 1, cols = Math.round(o.w / 38) || 1, bw = o.w / cols, bh = o.h / rows;
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
      const x = o.x + q * bw, yy = y + r * bh;
      c.fillStyle = '#a8703a'; c.fillRect(x, yy, bw, bh);
      c.strokeStyle = '#5e3a14'; c.lineWidth = 3; c.strokeRect(x + 1.5, yy + 1.5, bw - 3, bh - 3);
      c.beginPath(); c.moveTo(x + 3, yy + 3); c.lineTo(x + bw - 3, yy + bh - 3); c.moveTo(x + bw - 3, yy + 3); c.lineTo(x + 3, yy + bh - 3); c.stroke();
    }
  } else if (o.t === 'barrel') {
    c.fillStyle = '#3b6fb5'; rr(c, o.x, y, o.w, o.h, 8); c.fill();
    c.fillStyle = '#8fb8e8'; c.fillRect(o.x, y + 10, o.w, 4); c.fillRect(o.x, y + o.h - 14, o.w, 4);
  } else if (o.t === 'cone') {
    c.fillStyle = '#ff7a1a'; c.beginPath(); c.moveTo(o.x + o.w / 2, y); c.lineTo(o.x + o.w, GROUND); c.lineTo(o.x, GROUND); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.fillRect(o.x + 7, y + 16, o.w - 14, 6);
    c.fillStyle = '#222'; c.fillRect(o.x - 3, GROUND - 5, o.w + 6, 5);
  } else if (o.t === 'car') {
    c.fillStyle = '#c9303c'; rr(c, o.x, y + 14, o.w, o.h - 14, 8); c.fill();
    c.fillStyle = '#a81c2b'; rr(c, o.x + 20, y, o.w - 42, 22, 8); c.fill();
    c.fillStyle = '#bfe6ff'; rr(c, o.x + 26, y + 4, 20, 14, 3); c.fill(); rr(c, o.x + 50, y + 4, 20, 14, 3); c.fill();
    c.fillStyle = '#111'; c.beginPath(); c.arc(o.x + 22, GROUND - 6, 9, 0, 6.3); c.arc(o.x + o.w - 22, GROUND - 6, 9, 0, 6.3); c.fill();
    c.fillStyle = '#999'; c.beginPath(); c.arc(o.x + 22, GROUND - 6, 4, 0, 6.3); c.arc(o.x + o.w - 22, GROUND - 6, 4, 0, 6.3); c.fill();
    c.fillStyle = '#ffe9a0'; c.fillRect(o.x + o.w - 6, y + 22, 6, 6);
  }
}
function drawBird(c, b){
  const f = Math.sin(tAnim * 0.35 + b.x * 0.05) * 9, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  c.fillStyle = '#1b1b26'; c.beginPath(); c.ellipse(cx, cy, 15, 7, 0, 0, 6.3); c.fill();
  c.beginPath(); c.moveTo(cx - 6, cy - 2); c.lineTo(cx - 14, cy - 14 - f); c.lineTo(cx + 4, cy - 3); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(cx - 6, cy + 2); c.lineTo(cx - 14, cy + 12 + f); c.lineTo(cx + 4, cy + 3); c.closePath(); c.fill();
  c.fillStyle = '#ff9a1a'; c.beginPath(); c.moveTo(cx - 14, cy - 2); c.lineTo(cx - 24, cy + 1); c.lineTo(cx - 14, cy + 3); c.closePath(); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - 9, cy - 2, 1.8, 0, 6.3); c.fill();
}
function drawCoin(c, x, y){
  const w = Math.abs(Math.cos(tAnim * 0.08 + x * 0.02)) * 8 + 3;
  c.fillStyle = '#f5b800'; c.beginPath(); c.ellipse(x, y, w, 10, 0, 0, 6.3); c.fill();
  c.fillStyle = '#ffe27a'; c.beginPath(); c.ellipse(x, y, w * 0.6, 7, 0, 0, 6.3); c.fill();
}
function drawPower(c, u){
  const bob = Math.sin(tAnim * 0.1 + u.x * 0.01) * 4;
  c.fillStyle = u.t === 'shield' ? 'rgba(70,170,255,.95)' : 'rgba(240,70,95,.95)';
  c.beginPath(); c.arc(u.x, u.y + bob, 18, 0, 6.3); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke();
  c.font = '20px system-ui,Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  c.fillText(u.t === 'shield' ? '\u{1F6E1}' : '\u{1F9F2}', u.x, u.y + bob + 1);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
}
function hud(c){
  c.fillStyle = '#fff'; c.font = 'bold 22px system-ui,Arial'; c.textAlign = 'left';
  c.shadowColor = '#000a'; c.shadowBlur = 4;
  c.fillText('Score ' + score, 16, 32); c.fillText('Best ' + Math.max(save.best, score), 16, 58);
  c.textAlign = 'right'; c.fillStyle = '#ffd24a'; c.fillText('\u{1FA99} ' + runCoins, W - 16, 32);
  c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = 'bold 18px system-ui,Arial';
  let line = ''; if (shield) line += '\u{1F6E1} SHIELD   '; if (magnetT > 0) line += '\u{1F9F2} ' + Math.ceil(magnetT / 60) + 's';
  if (line) c.fillText(line, W / 2, 30);
  if (!save.tut && mode === 'play') {
    c.font = 'bold 24px system-ui,Arial'; c.fillStyle = '#ffd24a';
    c.fillText('TAP TO JUMP  •  TAP AGAIN = DOUBLE JUMP', W / 2, 140);
  }
  c.shadowBlur = 0; c.textAlign = 'left';
}
function render(){
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-4, 4), rnd(-4, 4));
  drawBG(ctx, bgScroll);
  for (const o of obstacles) drawObstacle(ctx, o);
  for (const b of birds) drawBird(ctx, b);
  for (const c of coins) drawCoin(ctx, c.x, c.y);
  for (const u of powers) drawPower(ctx, u);
  const air = p.y < GROUND - 1;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p.x + 4, GROUND + 4, Math.max(8, 26 - (GROUND - p.y) * 0.05), 5, 0, 0, 6.3); ctx.fill();
  const blink = inv > 0 && Math.floor(inv / 6) % 2 === 0;
  drawLion(ctx, p.x, p.y, tAnim, save.cfg, 1, air || mode === 'dead', blink ? 0.35 : 1);
  if (shield && (mode === 'play' || mode === 'pause')) {
    const pu = 0.18 + Math.sin(tAnim * 0.15) * 0.06;
    ctx.fillStyle = 'rgba(120,200,255,' + pu + ')'; ctx.strokeStyle = 'rgba(160,220,255,.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x + 2, p.y - 52, 62, 0, 6.3); ctx.fill(); ctx.stroke();
  }
  for (const q of parts) { ctx.globalAlpha = Math.max(0, q.life / 22); ctx.fillStyle = q.col; ctx.fillRect(q.x, q.y, 4, 4); }
  ctx.globalAlpha = 1;
  if (mode === 'play' || mode === 'dead' || mode === 'pause') hud(ctx);
  ctx.restore();
}

}

/* ---------- Screens & UI ---------- */

/* ---- Daily bonus ---- */
function dailyAvailable(){ return save.daily.last !== ymd(new Date()); }
function dailyInfo(){
  const y = new Date(); y.setDate(y.getDate() - 1);
  const streak = save.daily.last === ymd(y) ? save.daily.streak + 1 : 1;
  return {streak, reward: 20 + 10 * Math.min(streak - 1, 6)};
}
function renderDaily(){
  const av = dailyAvailable(), info = dailyInfo();
  $('dailyTxt').innerHTML = av ? 'Day ' + info.streak + ' streak<br>Reward: \u{1FA99} ' + info.reward + '  (2x with ad: \u{1FA99} ' + info.reward * 2 + ')' : 'Already claimed today.<br>Come back tomorrow!';
  $('bClaim').disabled = !av; $('bClaim2').disabled = !av;
}
function claimDaily(mult){
  const info = dailyInfo(); save.coins += info.reward * mult; save.daily = {last: ymd(new Date()), streak: info.streak};
  persist(); menuStats(); renderDaily(); showScreen('daily'); toast('+' + info.reward * mult + ' coins');
}
$('bDaily').onclick = () => { renderDaily(); showScreen('daily'); };

/* ---- Customize panel ---- */
let tab = 'fur';
const TABS = [['fur', 'Fur'], ['suit', 'Suit colour'], ['pat', 'Suit design'], ['hat', 'Hat'], ['cape', 'Cape'], ['extra', 'Extras']];
const owned = (cat, it) => it.p === 0 || save.owned[cat + ':' + it.id];
function pick(cat, it){
  if (!owned(cat, it)) {
    if (save.coins < it.p) { toast('Not enough coins'); beep(150, 0.15, 'sawtooth', 0.04); return; }
    save.coins -= it.p; save.owned[cat + ':' + it.id] = 1; beep(700, 0.12, 'triangle', 0.04);
  }
  save.cfg[cat] = it.id; persist(); renderCustom();
}
function renderCustom(){
  $('coinsEl').textContent = '\u{1FA99} ' + save.coins;
  const tabs = $('tabs'); tabs.innerHTML = '';
  TABS.forEach(([id, label]) => {
    const b = document.createElement('button'); b.className = 'tab' + (id === tab ? ' on' : ''); b.textContent = label;
    b.onclick = () => { tab = id; renderCustom(); }; tabs.appendChild(b);
  });
  const o = $('opts'); o.innerHTML = '';
  if (tab === 'extra') {
    [['glasses', '\u{1F60E} Sunglasses'], ['chain', '⛓️ Gold chain']].forEach(([k, label]) => {
      const d = document.createElement('div'); d.className = 'opt' + (save.cfg[k] ? ' sel' : '');
      d.innerHTML = label + '<div class="pr">' + (save.cfg[k] ? 'ON' : 'OFF') + '</div>';
      d.onclick = () => { save.cfg[k] = !save.cfg[k]; persist(); renderCustom(); }; o.appendChild(d);
    });
    return;
  }
  CAT[tab].forEach(it => {
    const d = document.createElement('div'); d.className = 'opt' + (save.cfg[tab] === it.id ? ' sel' : '');
    let h = ''; if (it.c) h += '<div class="sw" style="background:' + it.c + '"></div>';
    h += it.name; if (!owned(tab, it)) h += '<div class="pr">\u{1FA99} ' + it.p + '</div>';
    d.innerHTML = h; d.onclick = () => pick(tab, it); o.appendChild(d);
  });
}

/* ---------- Input ---------- */
cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (mode === 'play') doPause(); else if (mode === 'pause') { mode = 'play'; showScreen(null); } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { doPause(); persist(); } });

/* ---------- Main loop ---------- */
let last = performance.now(), pauseShown = false;
function loop(now){
  const k = Math.min(2.5, (now - last) / 16.667); last = now;
  update(k); render();
  if (mode === 'custom') renderPreview();
  const sp = mode === 'play'; if (sp !== pauseShown) { pauseShown = sp; $('bPause').style.display = sp ? 'block' : 'none'; }
  requestAnimationFrame(loop);
}
Ads.init(); menuStats(); requestAnimationFrame(loop);
</script>
</body>
</html>
